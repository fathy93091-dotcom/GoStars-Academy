    <script>
      window.addEventListener('unhandledrejection', function(event) {
        if (event.reason && (event.reason.message === 'WebSocket closed without opened.' || (typeof event.reason === 'string' && event.reason.includes('WebSocket')))) {
          event.preventDefault();
        }
      });
